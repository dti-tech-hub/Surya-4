# Conda environment for QE-IDS.
#
# The reported results were produced on Python 3.14.5 with pip-installed
# packages.  Python 3.12 is used here as a conservative, widely available
# baseline; the code uses no 3.14-only syntax.
#
#   conda env create -f environment.yml
#   conda activate qe-ids
#   python run_all.py --mode quick
#
# If a pinned wheel is unavailable for your platform/Python version, install
# requirements.txt in a plain virtual environment instead.

name: qe-ids
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.4.4
      - scipy==1.17.1
      - pandas==3.0.1
      - scikit-learn==1.8.0
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - torch==2.14.1
      - torchvision==0.29.1
      - qiskit==2.6.0
      - qiskit-aer==0.18.0
      - qiskit-machine-learning==0.9.1
      - shap==0.53.0
      - streamlit==1.65.0
      - pyarrow==25.0.1
      - joblib==1.5.3
      - pytest==9.1.1
      - PyYAML==6.0.3
      - tabulate==0.10.0
